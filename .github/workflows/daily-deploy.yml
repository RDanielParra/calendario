name: daily-deploy
on:
  schedule:
    - cron: "10 6 * * *"
    - cron: "40 6 * * *"
    - cron: "10 7 * * *"
    - cron: "10 9 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy en Vercel
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: Avisar a Piojo
        if: ${{ github.event.schedule == '10 6 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          DAY=$(TZ=America/Managua date +%-d)
          MONTH=$(TZ=America/Managua date +%-m)
          if [ "$MONTH" = "12" ]; then MSG="Se publico el dia $DAY"; else MSG="Deploy diario ejecutado ($DAY/$MONTH)"; fi
          curl -s -H "Title: Calendario" -d "$MSG" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"

      - name: Avisar si fallo
        if: ${{ failure() }}
        run: |
          curl -s -H "Title: Fallo el deploy" -H "Priority: high" -d "Fallo la action, publica el dia a mano" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
