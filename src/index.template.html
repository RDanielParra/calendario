<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe9f0">
<title>Calendario de Adviento ✨</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fffaf6;--pink:#f9c9d6;--pink2:#f4a9be;--rose:#e57fa0;--rose-d:#b84a6e;--ink:#5a3a48;--gold:#e8c39e;--sage:#b9d8c4;--lilac:#e6d4f2;--soft:0 8px 22px rgba(184,74,110,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;font-size:17px;
  background:linear-gradient(180deg,#ffe6ee 0,#fff0f3 32%,#fff8f4 70%,#fffaf6 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(244,169,190,.28) 1.4px,transparent 1.8px);background-size:22px 22px}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
header,main,footer,#wait{position:relative;z-index:2}
header{text-align:center;padding:22px 16px 4px;max-width:980px;margin:0 auto}
.hero{width:min(210px,56vw);height:auto;display:block;margin:0 auto}
.hero-img{width:min(260px,70vw);display:block;margin:0 auto;border-radius:22px;box-shadow:var(--soft)}
h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(2.4rem,9vw,3.8rem);margin:2px 0 0;color:var(--rose-d);line-height:1}
.sub{margin:4px auto 0;max-width:520px;color:var(--ink);opacity:.85}
.bubble{display:inline-block;background:#fff;border-radius:20px;padding:8px 16px;margin-top:12px;box-shadow:var(--soft);max-width:560px;font-size:.95rem}
.status{margin:12px auto 0;font-weight:600;color:var(--rose-d)}
.badge{display:inline-block;margin-top:8px;background:linear-gradient(135deg,#ffe3b8,#f6c6d4);border-radius:999px;padding:5px 16px;font-weight:700;box-shadow:var(--soft)}
/* sala de espera */
#wait{max-width:760px;margin:14px auto 0;padding:0 14px}
.wcard{background:rgba(255,255,255,.85);border-radius:26px;box-shadow:var(--soft);padding:16px;text-align:center;backdrop-filter:blur(4px)}
.wcard h3{font-family:'Caveat',cursive;font-size:1.9rem;margin:0 0 6px;color:var(--rose-d)}
.cd{display:flex;justify-content:center;gap:10px}
.cd div{background:linear-gradient(160deg,#ffe3ec,#fff);border-radius:16px;min-width:64px;padding:8px 6px;box-shadow:inset 0 0 0 1.5px var(--pink)}
.cd b{display:block;font-size:1.7rem;color:var(--rose-d);line-height:1.1}.cd span{font-size:.75rem;opacity:.8}
.chip{display:inline-block;margin:12px 4px 0;background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;box-shadow:0 3px 10px rgba(184,74,110,.12)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.act{border:0;border-radius:20px;padding:12px 6px;cursor:pointer;font-family:inherit;font-weight:700;color:var(--ink);box-shadow:var(--soft);transition:transform .15s}
.act:active{transform:scale(.96)}.act i{display:block;font-style:normal;font-size:1.8rem;margin-bottom:2px}.act small{font-weight:500;opacity:.75}
.act.a0{background:linear-gradient(160deg,#ffd3e0,#ffeaf1)}.act.a1{background:linear-gradient(160deg,#e4d3f5,#f6eefc)}.act.a2{background:linear-gradient(160deg,#ffe6cf,#fff4e8)}
main{max-width:760px;margin:0 auto;padding:18px 14px 30px}
.case{background:linear-gradient(160deg,#fff,#ffeef3);border-radius:30px;padding:18px;box-shadow:0 14px 34px rgba(184,74,110,.2),inset 0 0 0 3px #fff,inset 0 0 0 5px var(--gold)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(min-width:720px){#grid{grid-template-columns:repeat(6,1fr);gap:16px}}
.door{position:relative;aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Caveat',cursive;font-weight:700;transition:transform .25s ease,filter .2s;
  box-shadow:inset 0 3px 6px rgba(255,255,255,.75),inset 0 -5px 9px rgba(0,0,0,.1),0 6px 14px rgba(184,74,110,.22)}
.door.c0{background:radial-gradient(circle at 30% 25%,#ffd9e4,#f08fb0)}.door.c1{background:radial-gradient(circle at 30% 25%,#f3e3fb,#bf9be3)}
.door.c2{background:radial-gradient(circle at 30% 25%,#ffe8d8,#f4a98a)}.door.c3{background:radial-gradient(circle at 30% 25%,#e6f6ec,#8fcaa6)}
.door.c4{background:radial-gradient(circle at 30% 25%,#fbe5d6,#d49a85)}.door.c5{background:radial-gradient(circle at 30% 25%,#e6f3fc,#9cc7e8)}
.door .num{font-size:clamp(1.8rem,7vw,2.7rem);line-height:.95;text-shadow:0 2px 4px rgba(0,0,0,.18)}
.door .ico{font-size:clamp(.9rem,3.4vw,1.3rem);line-height:1;font-family:'Quicksand',sans-serif}
.door:active{transform:scale(.94)}
.door.locked{filter:saturate(.5) brightness(.97)}
.door.available{animation:glow 2s ease-in-out infinite}
.door.opened{background:radial-gradient(circle at 30% 25%,#fff,#ffe9ef)!important;color:var(--rose-d)}
.door.opened .num{text-shadow:none}
@keyframes glow{0%,100%{box-shadow:inset 0 3px 6px rgba(255,255,255,.75),inset 0 -5px 9px rgba(0,0,0,.1),0 6px 14px rgba(184,74,110,.22),0 0 0 0 rgba(244,169,190,.8)}50%{box-shadow:inset 0 3px 6px rgba(255,255,255,.75),inset 0 -5px 9px rgba(0,0,0,.1),0 6px 14px rgba(184,74,110,.22),0 0 0 10px rgba(244,169,190,0)}}
.door.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px) rotate(-5deg)}30%{transform:translateX(9px) rotate(5deg)}45%{transform:translateX(-7px)}60%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.door.dodging{z-index:30;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.door.shield::before{content:"🛡️";position:absolute;top:-8px;right:-6px;font-size:1.1rem}
footer{text-align:center;padding:10px 16px 90px;max-width:760px;margin:0 auto;font-size:.95rem;opacity:.9}
.pbtn{font-family:inherit;background:#fff;border:1.5px dashed var(--pink2);border-radius:12px;padding:6px 12px;cursor:pointer;color:var(--ink);opacity:.7;margin:6px 4px}
.pbtn:hover{opacity:1}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(120,60,80,.4);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px}
.card{position:relative;background:var(--cream);border-radius:28px;box-shadow:0 20px 50px rgba(120,40,70,.3),inset 0 0 0 2px var(--pink);width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px 20px 24px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:10px;right:12px;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:1rem;cursor:pointer;box-shadow:0 3px 8px rgba(184,74,110,.2);color:var(--rose-d)}
.tag{display:inline-block;background:var(--pink);color:var(--rose-d);font-weight:700;border-radius:999px;padding:3px 12px;font-size:.85rem}
.tag.funny{background:#d9eee1;color:#3f7a58}.tag.coupon{background:#ffe5c8;color:#a86a2a}
.card h2{font-family:'Caveat',cursive;font-size:2.1rem;margin:8px 40px 6px 0;color:var(--rose-d);line-height:1.05}
.media{margin:8px 0 12px;text-align:center}
.media svg{width:100%;max-width:300px;height:auto}
.photo{max-width:100%;max-height:340px;border-radius:18px;box-shadow:var(--soft)}
audio{width:100%;margin-top:8px}
.msg p{margin:0 0 10px;font-family:'Caveat',cursive;font-size:1.5rem;line-height:1.22}
.lnk{display:inline-block;margin:2px 0 8px;color:var(--rose-d);font-weight:700}
.claim{font-family:inherit;font-weight:700;font-size:1.05rem;background:linear-gradient(135deg,#f6a6bf,#f28aa9);color:#fff;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 6px 16px rgba(229,127,160,.5);margin-top:6px}
.claim:active{transform:scale(.96)}
.stamp{display:inline-block;margin-top:6px;border:3px double var(--rose);color:var(--rose);font-weight:700;padding:6px 14px;border-radius:12px;transform:rotate(-4deg);letter-spacing:1px}
.pnote{margin-top:12px;background:#fff7c9;border-radius:12px;padding:8px 10px;font-size:.9rem}
/* tocador */
.rows{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row b{min-width:78px;font-size:.9rem}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--rose);outline-offset:2px}
.look{font-size:.85rem;opacity:.8;margin:4px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{font-family:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:#fff;color:var(--rose-d);box-shadow:0 3px 10px rgba(184,74,110,.18)}
.pill.main{background:linear-gradient(135deg,#f6a6bf,#f28aa9);color:#fff}
/* juego */
.gbar{display:flex;justify-content:space-between;font-weight:700;margin:6px 0}
#garena{position:relative;height:300px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#ffe9f1,#fff7ee);box-shadow:inset 0 0 0 2px var(--pink);touch-action:manipulation}
.gi{position:absolute;top:-50px;border:0;background:transparent;font-size:2rem;cursor:pointer;padding:0;animation:fallg linear forwards;transition:opacity .3s,scale .3s;user-select:none}
@keyframes fallg{to{transform:translateY(var(--h))}}
.gres{text-align:center;font-family:'Caveat',cursive;font-size:1.6rem;min-height:36px;margin-top:6px}
/* cartitas */
.note{background:#fff;border-radius:16px;padding:10px 14px;margin:8px 0;box-shadow:0 3px 10px rgba(184,74,110,.1)}
.note summary{cursor:pointer;font-weight:700;color:var(--rose-d)}
.note p{margin:6px 0 2px;font-family:'Caveat',cursive;font-size:1.4rem;line-height:1.2}
.note.lock{opacity:.6}
/* overlays */
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(60,25,40,.78)}
.term{width:min(520px,100%);background:#1d1220;color:#ffb6d0;border:2px solid #f08fb0;border-radius:16px;padding:12px 14px;font-family:'Courier New',monospace;font-size:.95rem}
.term-bar{opacity:.7;margin-bottom:8px}.term pre{margin:0 0 10px;white-space:pre-wrap;min-height:110px}
.prog{height:16px;border:2px solid #f08fb0;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:#f08fb0}
.term.glitch{animation:glitch .4s steps(2) 2}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-6px,3px);filter:hue-rotate(90deg)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-3px);filter:invert(1)}100%{transform:translate(0)}}
.alarm{width:min(480px,100%);text-align:center;background:#fff;border:4px solid var(--rose);border-radius:24px;padding:20px;animation:flash .6s infinite alternate}
@keyframes flash{from{background:#fff}to{background:#ffd9e3}}
.siren{font-size:3rem;animation:shake .6s infinite}
.alarm h2{font-family:'Caveat',cursive;font-size:2.2rem;color:var(--rose-d);margin:6px 0}.alarm p{font-size:1.1rem}
.obtn{font-family:inherit;font-weight:700;font-size:1rem;background:linear-gradient(135deg,#f6a6bf,#f28aa9);color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 6px 16px rgba(229,127,160,.5)}
.obtn:disabled{opacity:.5;cursor:not-allowed}
.logro{width:min(480px,100%);text-align:center;background:var(--cream);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:20px}
.trophy{font-size:3.2rem}.logro h2{margin:0;font-family:'Caveat',cursive;font-size:2rem;color:#3f7a58}
.logro h3{margin:2px 0 10px;font-family:'Caveat',cursive;color:var(--rose-d);font-size:2.2rem;line-height:1}
.multa{background:#fff;border:2px dashed var(--rose);border-radius:16px;padding:8px 12px;margin:10px 0;text-align:left}.multa p{margin:4px 0}
.patmsg{min-height:24px;margin-top:8px;font-weight:600;color:var(--rose-d)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(30px);z-index:90;max-width:min(520px,92vw);background:#fff;border-radius:18px;box-shadow:var(--soft);padding:10px 16px;opacity:0;pointer-events:none;transition:.3s;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.bit{position:absolute;font-size:1.5rem;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
#player{position:fixed;left:10px;bottom:10px;z-index:60;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--soft)}
#pbtn{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(135deg,#f6a6bf,#f28aa9);color:#fff;cursor:pointer;font-size:1rem}
#vol{width:78px;accent-color:var(--rose)}#plabel{font-size:.85rem}
@media(max-width:420px){#plabel{display:none}.acts{gap:6px}.act{font-size:.85rem}}

/* ---------- interacciones por día ---------- */
.ix{margin:10px 0 4px}
.ixq{font-family:'Caveat',cursive;font-size:1.55rem;line-height:1.2;color:var(--rose-d);margin:0 0 8px;text-align:center}
.ixopts{display:flex;flex-direction:column;gap:8px}
.ixopt{font-family:inherit;font-size:1rem;text-align:left;border:0;border-radius:16px;padding:11px 14px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--pink);cursor:pointer}
.ixopt.bad{background:#ffe3ec;box-shadow:inset 0 0 0 2px var(--rose);animation:shake .5s;opacity:.7}
.ixopt.good{background:var(--sage);box-shadow:inset 0 0 0 2px #7fb593}
.ixmsg{min-height:1.4em;text-align:center;color:var(--rose-d);font-weight:700;margin:8px 0 0}
.ixrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.ixin{flex:1;min-width:150px;padding:10px 12px;border-radius:14px;border:2px solid var(--pink2);font:inherit;font-size:1rem;background:#fff;color:var(--ink)}
.reveal{animation:revealIn .8s ease both}
@keyframes revealIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.scratchwrap{position:relative}
.scratchwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;touch-action:none;cursor:grab;transition:opacity .8s}
.pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.sw{width:58px;height:58px;border-radius:50%;border:3px solid #fff;box-shadow:var(--soft);cursor:pointer;transition:transform .2s}
.sw:hover,.sw.on{transform:scale(1.15)}
.swtxt{min-height:3.2em;text-align:center;font-family:'Caveat',cursive;font-size:1.45rem;line-height:1.2;margin-top:10px;color:var(--ink)}
.tl{position:relative;margin:8px 0 0 12px;padding-left:18px;border-left:3px dotted var(--pink2)}
.tli{position:relative;margin-bottom:12px;animation:revealIn .7s ease both}
.tli::before{content:'♥';position:absolute;left:-30px;top:0;color:var(--rose);background:var(--cream);font-size:1rem;line-height:1}
.tli b{display:block;color:var(--rose-d);font-size:.9rem}
.tli span{font-family:'Caveat',cursive;font-size:1.35rem;line-height:1.15}
.layerbtn{display:block;margin:6px auto 0}

/* ---------- heladería v2 (pantalla completa) ---------- */
#helg{position:fixed;inset:0;height:100dvh;z-index:300;background:radial-gradient(circle at 15% 12%,#fff 0,transparent 26%),radial-gradient(circle at 88% 30%,#ffe3ec 0,transparent 30%),linear-gradient(180deg,#ffd3e2 0%,#ffeaf1 42%,#fff7ee 100%);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;font-family:inherit;color:var(--ink)}
.hg-col{width:min(520px,100%);height:100%;margin:0 auto;display:flex;flex-direction:column;padding:8px 12px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}
.hg-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;color:var(--rose-d)}
.hg-x{border:0;background:#fff;color:var(--rose-d);width:36px;height:36px;border-radius:50%;font-size:1.1rem;box-shadow:var(--soft);cursor:pointer}
.hg-cust{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:92px}
.hg-face{font-size:3.4rem;line-height:1;animation:hgIn .6s cubic-bezier(.3,1.4,.5,1) both}
.hg-face.bob{animation:hgIn .6s cubic-bezier(.3,1.4,.5,1) both,bobh 1.8s ease-in-out .6s infinite}
@keyframes hgIn{from{transform:translateX(-90px);opacity:0}to{transform:none;opacity:1}}
.hg-bubble{position:relative;flex:1;background:#fff;border-radius:18px;padding:8px 10px;box-shadow:0 6px 16px rgba(184,74,110,.18);display:flex;gap:8px;align-items:center;font-size:.92rem;line-height:1.2}
.hg-bubble::before{content:'';position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.hg-bubble b{color:var(--rose-d)}
.hg-bubble .tk{flex:1;min-width:0}
.hg-bubble .mini{flex:0 0 auto;background:#fff0f5;border-radius:12px;padding:2px 4px}
#hg-stagewrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#hg-stage{position:relative;height:min(100%,310px);aspect-ratio:200/260;transition:transform .2s,filter .2s}
#hg-stage.over{transform:scale(1.03);filter:drop-shadow(0 0 14px rgba(229,127,160,.55))}
#hg-stage svg{width:100%;height:100%;overflow:visible}
.plop{transform-box:fill-box;transform-origin:50% 100%;animation:plop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes plop{0%{transform:translateY(-70px) scale(.5,1.3);opacity:0}55%{transform:translateY(4px) scale(1.18,.82);opacity:1}100%{transform:none}}
.pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18);opacity:.5}}
#hg-hint{position:absolute;left:0;right:0;top:0;text-align:center;font-weight:700;font-size:.9rem;color:var(--rose-d);padding:2px 8px;text-shadow:0 1px 0 #fff}
#hg-hint.flash{animation:flashh .5s}
@keyframes flashh{30%{transform:scale(1.08);color:#d93a5f}}
#hg-flame{position:absolute;right:0;bottom:6%;width:78px;text-align:center;transition:opacity .2s}
#hg-flame .flm{font-size:2.6rem;filter:drop-shadow(0 4px 6px rgba(217,58,95,.35));transition:transform .15s}
#hg-flame.hot .flm{transform:scale(1.3) rotate(-6deg)}
#hg-bar{position:relative;height:10px;background:#fff;border-radius:99px;box-shadow:inset 0 0 0 2px var(--pink);overflow:hidden}
#hg-bar b{position:absolute;left:37.5%;width:37.5%;top:0;bottom:0;background:rgba(232,182,106,.55)}
#hg-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#fff,#e8b66a,#3b2b24)}
#hg-flame small{font-size:.7rem;color:var(--rose-d);font-weight:700}
.hg-tray{background:#fff;border-radius:24px 24px 18px 18px;box-shadow:0 -6px 20px rgba(184,74,110,.15);padding:8px 8px 6px}
.hg-tabs{display:flex;gap:6px;margin-bottom:6px}
.hg-tab{flex:1;font-family:inherit;font-weight:700;font-size:.85rem;border:0;border-radius:14px;padding:7px 4px;background:#ffeaf1;color:var(--rose-d);cursor:pointer}
.hg-tab.on{background:linear-gradient(135deg,#f6a6bf,#f28aa9);color:#fff}
.hg-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-height:118px;align-content:start}
.hitem{touch-action:none;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px;border-radius:16px;background:#fff7fa;box-shadow:inset 0 0 0 1.5px var(--pink);font-size:.78rem;font-weight:700;color:var(--ink)}
.hitem:active{background:#ffe3ec}
.hg-actions{display:flex;gap:8px;justify-content:center;margin-top:8px}
.hghost{position:fixed;z-index:500;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.1);filter:drop-shadow(0 10px 10px rgba(120,40,70,.3))}
.hghost.hot{filter:drop-shadow(0 0 12px #ff9d3c)}
.hfall{position:fixed;z-index:480;pointer-events:none;animation:hfall .9s cubic-bezier(.5,0,.9,.55) forwards}
@keyframes hfall{0%{transform:translate(-50%,-50%) rotate(0);opacity:1}75%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot));opacity:0}}
.hfloat{position:fixed;z-index:490;pointer-events:none;font-weight:800;font-size:1.3rem;color:var(--rose-d);text-shadow:0 2px 0 #fff;animation:hfl 1.2s ease-out forwards;transform:translateX(-50%)}

.hg-intro,.hg-end{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px}

.hg-patwrap{height:8px;border-radius:99px;background:#ffe3ec;overflow:hidden;margin-top:5px}
.hg-patwrap i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f28aa9,#7fb593)}

<body>
<canvas id="snow"></canvas>

<header>
  <div id="heroSlot"></div>
  <h1>Calendario de Adviento</h1>
  <p class="sub">24 sorpresitas · una por día · hechas con muchísimo cariño 💗</p>
  <div class="bubble">Aquí manda Piojo… <b>temporalmente</b>. 😌 (En todo lo demás ya sabemos quién manda.)</div>
  <p class="status" id="status"></p>
  <div id="logroBadge" hidden><span class="badge">🏆 La Más Desesperada del Universo</span></div>
</header>

<section id="wait" hidden>
  <div class="wcard">
    <h3>✨ Sala de espera ✨</h3>
    <div class="cd" id="cd"></div>
    <div class="acts">
      <button class="act a0" id="actTocador"><i>💄</i>Mi tocador<br><small>de Navidad</small></button>
      <button class="act a1" id="actGame"><i>🎁</i>Atrapa<br><small>regalitos</small></button>
      <button class="act a2" id="actNotes"><i>💌</i>Cartitas<br><small id="notesCount"></small></button>
    </div>
  </div>
</section>

<main><div class="case"><div id="grid"></div></div></main>

<footer>
  <div>Hecho con 💗 por Piojo, para la mejor jefa del universo.</div>
  <div id="pfoot" hidden><button class="pbtn" id="previewBtn">🛠️ Modo Vista Previa (Piojo): OFF</button><button class="pbtn" id="resetBtn" hidden>↺ Reiniciar progreso</button></div>
</footer>

<div id="modal" class="modal" hidden><div class="card" role="dialog" aria-modal="true"><button class="x" id="mclose" aria-label="Cerrar">✕</button><div id="mbody"></div></div></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast"></div>
<div id="fx"></div>
<div id="player"><button id="pbtn" aria-label="Música">▶</button><input id="vol" type="range" min="0" max="100" value="25" aria-label="Volumen"><span id="plabel">🎵 navidad soft</span></div>
<audio id="bgm" loop preload="none"></audio>

<script src="data.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN (edítala tú)
   ===================================================================== */
const NTFY_TOPIC = "__NTFY_TOPIC__";
const AUDIO_NAVIDAD_URL = "media/navidad-soft.mp3";  // tu mp3 (instrumental/lofi/piano recomendado); si no existe suena la cajita de música
const HEADER_IMAGE_URL = "";                         // opcional: imagen tuya para el encabezado
const YEAR = 2026;
const GATE_HASH = __GATE_HASH__;

const CALENDAR_DAYS = (window.ADVENT_DATA||{}).days||[];
const WAIT_NOTES = (window.ADVENT_DATA||{}).notes||[];

/* =====================================================================
   A PARTIR DE AQUÍ NO HACE FALTA TOCAR NADA
   ===================================================================== */
(function(){
'use strict';
const $ = s => document.querySelector(s);
const mem = {};
const wrap = (api, pre) => ({
  get(k,d){ try{ const v=api.getItem('adv2026_'+k); return v===null?d:JSON.parse(v);}catch(e){ return (pre+k in mem)?mem[pre+k]:d; } },
  set(k,v){ try{ api.setItem('adv2026_'+k, JSON.stringify(v)); }catch(e){ mem[pre+k]=v; } }
});
let _ls, _ss; try{_ls=localStorage}catch(e){_ls={getItem(){throw 0},setItem(){throw 0}}} try{_ss=sessionStorage}catch(e){_ss={getItem(){throw 0},setItem(){throw 0}}}
const store = wrap(_ls,'l_'), sess = wrap(_ss,'s_');
let preview = !!store.get('gate', false) && !!store.get('preview', false);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = a => a[Math.floor(Math.random()*a.length)];

/* ---------- texto ---------- */
const fill = s => String(s);

/* ---------- ntfy ---------- */
function encHeader(s){ return /^[\x20-\x7E]*$/.test(s) ? s : '=?UTF-8?B?'+btoa(unescape(encodeURIComponent(s)))+'?='; }
function notifyPiojo(titulo, mensaje, prioridad){
  if(preview) return;
  try{ fetch('https://ntfy.sh/'+NTFY_TOPIC, { method:'POST', headers:{ 'Title': encHeader(titulo), 'Priority': prioridad||'default' }, body: mensaje }).catch(()=>{}); }catch(e){}
}

/* ---------- fechas / bloqueo ---------- */
function unlockedUpTo(){
  if(preview) return 24;
  const n=new Date(), y=n.getFullYear(), m=n.getMonth(), d=n.getDate();
  if(y>YEAR) return 24; if(y<YEAR) return 0; if(m<11) return 0;
  return Math.min(d,24);
}
const doorDate = day => new Date(YEAR,11,day,0,0,0);
function fmtRemaining(ms){
  const t=Math.max(1,Math.ceil(ms/60000)), d=Math.floor(t/1440), h=Math.floor((t%1440)/60), m=t%60;
  if(d>0) return d+(d===1?' día':' días')+' y '+h+(h===1?' hora':' horas');
  if(h>0) return h+(h===1?' hora':' horas')+' y '+m+' min';
  return m+' min';
}
const todayKey = () => { const n=new Date(); return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate(); };
function getAttempts(){
  const l=store.get('att',{k:'',n:0}), s=sess.get('att',{k:'',n:0}), k=todayKey();
  return Math.max(l.k===k?l.n:0, s.k===k?s.n:0);
}
function bumpAttempts(){ const o={k:todayKey(), n:getAttempts()+1}; store.set('att',o); sess.set('att',o); return o.n; }

/* ---------- UI helpers ---------- */
let toastT;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),3600); }
function burst(x,y,n){
  const fx=$('#fx'), em=['💗','✨','🌸','🎀','⭐','💖','🌼'];
  for(let i=0;i<(n||26);i++){
    const b=document.createElement('span'); b.className='bit'; b.textContent=rnd(em);
    b.style.left=x+'px'; b.style.top=y+'px';
    const a=Math.random()*Math.PI*2, r=90+Math.random()*190;
    b.style.setProperty('--dx',Math.cos(a)*r+'px'); b.style.setProperty('--dy',(Math.sin(a)*r-60)+'px'); b.style.setProperty('--r',(Math.random()*540-270)+'deg');
    fx.appendChild(b); setTimeout(()=>b.remove(),1700);
  }
}
function openOverlay(html){ const o=$('#overlay'); o.innerHTML=html; o.hidden=false; return o; }
function closeOverlay(){ const o=$('#overlay'); o.hidden=true; o.innerHTML=''; }
let modalCleanup=null;
function showModal(html,cleanup){
  if(modalCleanup){ try{modalCleanup();}catch(e){} }
  modalCleanup=cleanup||null; $('#mbody').onclick=null; $('#mbody').innerHTML=html;
  $('#modal').hidden=false; $('#modal .card').scrollTop=0;
}
function closeModal(){ if(modalCleanup){ try{modalCleanup();}catch(e){} modalCleanup=null; } $('#modal').hidden=true; $('#mbody').innerHTML=''; $('#mbody').onclick=null; duck(false); }
$('#mclose').onclick=closeModal;
$('#modal').addEventListener('pointerdown',e=>{ if(e.target.id==='modal') closeModal(); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#modal').hidden) closeModal(); });

/* ---------- nieve suave ---------- */
(function(){
  const c=$('#snow'), x=c.getContext('2d'); let w,h,fl=[];
  function rs(){ w=c.width=innerWidth; h=c.height=innerHeight; fl=Array.from({length:Math.min(80,Math.floor(w/12))},()=>({x:Math.random()*w,y:Math.random()*h,r:1.2+Math.random()*2.8,s:.25+Math.random()*.6,d:Math.random()*6.28})); }
  function f(){ x.clearRect(0,0,w,h); x.fillStyle='rgba(255,255,255,.95)'; x.strokeStyle='rgba(244,169,190,.55)'; x.lineWidth=1;
    for(const p of fl){ p.y+=p.s; p.d+=.01; p.x+=Math.sin(p.d)*.35; if(p.y>h+5){p.y=-5;p.x=Math.random()*w}
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.3); x.fill(); x.stroke(); }
    requestAnimationFrame(f); }
  rs(); addEventListener('resize',rs); f();
})();

/* ---------- ilustraciones originales ---------- */
const STR='#c9708f';
function flower(cx,cy,r,col,center){
  let p=''; for(let i=0;i<8;i++) p+=`<ellipse cx="${cx}" cy="${cy-r}" rx="${r*.42}" ry="${r*.78}" fill="${col}" stroke="${STR}" stroke-width="1.5" transform="rotate(${i*45} ${cx} ${cy})"/>`;
  return p+`<circle cx="${cx}" cy="${cy}" r="${r*.55}" fill="${center}" stroke="${STR}" stroke-width="1.5"/>`;
}
const SPARK='<g fill="#fff" stroke="#f4a9be" stroke-width="1"><circle cx="22" cy="24" r="4"/><circle cx="214" cy="30" r="3"/><circle cx="196" cy="118" r="3.5"/><circle cx="30" cy="110" r="3"/><circle cx="120" cy="12" r="3"/></g>';
function art(type){
  if(type==='romantic') return `<svg viewBox="0 0 240 170" role="img" aria-label="Ramo de flores"><rect x="4" y="4" width="232" height="162" rx="26" fill="#fff0f4"/>${SPARK}
   <g stroke="#8fcaa6" stroke-width="5" fill="none" stroke-linecap="round"><path d="M120 150 L72 78"/><path d="M120 150 L120 66"/><path d="M120 150 L168 78"/></g>
   ${flower(72,66,17,'#ffd86b','#b9774a')}${flower(120,50,19,'#ffe38a','#b9774a')}${flower(168,66,17,'#f9b6cb','#b9774a')}
   <path d="M120 150 l-24 9 l24 -3 l24 3z" fill="#f08fb0" stroke="${STR}" stroke-width="1.5"/></svg>`;
  if(type==='funny') return `<svg viewBox="0 0 240 170" role="img" aria-label="Control de videojuegos"><rect x="4" y="4" width="232" height="162" rx="26" fill="#f1f8f3"/>${SPARK}
   <path d="M62 62 h116 c26 0 40 30 44 56 c3 20-16 26-28 12 l-14-18 h-120 l-14 18 c-12 14-31 8-28-12 c4-26 18-56 44-56z" fill="#f6a6bf" stroke="${STR}" stroke-width="2"/>
   <rect x="72" y="78" width="30" height="10" rx="4" fill="#fff"/><rect x="82" y="68" width="10" height="30" rx="4" fill="#fff"/>
   <circle cx="152" cy="74" r="8" fill="#ffe38a" stroke="${STR}" stroke-width="1.5"/><circle cx="172" cy="90" r="8" fill="#b9d8c4" stroke="${STR}" stroke-width="1.5"/>
   <path d="M196 26 l4 10 l10 1 l-8 7 l3 10 l-9-6 l-9 6 l3-10 l-8-7 l10-1z" fill="#ffe38a" stroke="${STR}" stroke-width="1.5"/></svg>`;
  return `<svg viewBox="0 0 240 170" role="img" aria-label="Vale"><rect x="4" y="4" width="232" height="162" rx="26" fill="#fff6e8"/>${SPARK}
   <path d="M30 42 h180 a8 8 0 0 1 8 8 v22 a14 14 0 0 0 0 26 v22 a8 8 0 0 1 -8 8 h-180 a8 8 0 0 1 -8-8 v-22 a14 14 0 0 0 0-26 v-22 a8 8 0 0 1 8-8z" fill="#f9c9d6" stroke="${STR}" stroke-width="2"/>
   <line x1="160" y1="48" x2="160" y2="124" stroke="${STR}" stroke-width="2" stroke-dasharray="6 6"/>
   <text x="88" y="92" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="40" fill="#b84a6e">VALE</text>
   <path d="M190 100 c-14-14-26-2-18 8 l18 16 l18-16 c8-10-4-22-18-8z" transform="translate(0 -18) scale(.9) translate(18 8)" fill="#e57fa0"/></svg>`;
}
function heroSVG(){
  return `<svg class="hero" viewBox="0 0 200 150" role="img" aria-label="Regalo navideño">
   <ellipse cx="100" cy="140" rx="80" ry="8" fill="#fff" stroke="#f4a9be" stroke-width="1.5"/>
   <rect x="52" y="64" width="96" height="72" rx="12" fill="#f9c9d6" stroke="#e57fa0" stroke-width="2"/>
   <rect x="94" y="64" width="12" height="72" fill="#fff6e8"/><rect x="52" y="92" width="96" height="12" fill="#fff6e8"/>
   <ellipse cx="82" cy="52" rx="20" ry="13" fill="#f4a9be" stroke="#e57fa0" stroke-width="2" transform="rotate(-20 82 52)"/>
   <ellipse cx="118" cy="52" rx="20" ry="13" fill="#f4a9be" stroke="#e57fa0" stroke-width="2" transform="rotate(20 118 52)"/>
   <circle cx="100" cy="58" r="8" fill="#fff6e8" stroke="#e57fa0" stroke-width="2"/>
   <g fill="#ffe38a" stroke="#e8c39e" stroke-width="1"><path d="M30 40 l3 7 l7 1 l-5 5 l2 7 l-7-4 l-7 4 l2-7 l-5-5 l7-1z"/><path d="M168 24 l3 7 l7 1 l-5 5 l2 7 l-7-4 l-7 4 l2-7 l-5-5 l7-1z"/></g></svg>`;
}
(function(){ const s=$('#heroSlot'); s.innerHTML = HEADER_IMAGE_URL ? `<img class="hero-img" src="${esc(HEADER_IMAGE_URL)}" alt="">` : heroSVG();
  const im=s.querySelector('img'); if(im) im.onerror=()=>{ s.innerHTML=heroSVG(); }; })();

/* ---------- grid ---------- */
const TYPE_ICON={romantic:'💌',funny:'😂',coupon:'🎟️'};
const TYPE_LABEL={romantic:'💌 Carta',funny:'😂 Risas',coupon:'🎟️ Vale'};
const grid=$('#grid');
for(let n=1;n<=24;n++){
  const b=document.createElement('button'); b.className='door c'+(n%6); b.dataset.day=n;
  b.innerHTML=`<span class="num">${n}</span><span class="ico"></span>`; grid.appendChild(b);
}
function waitVisible(){ return preview || new Date()<doorDate(1); }
function refreshDoors(){
  const up=unlockedUpTo(), opened=store.get('opened',[]), shield=shieldActive();
  grid.querySelectorAll('.door').forEach(b=>{
    const n=+b.dataset.day, d=CALENDAR_DAYS.find(x=>x.day===n), locked=n>up, isOp=!locked&&opened.includes(n)&&!preview;
    b.classList.toggle('locked',locked); b.classList.toggle('opened',isOp); b.classList.toggle('available',!locked&&!isOp);
    b.classList.toggle('shield',locked&&shield);
    b.querySelector('.ico').textContent = locked?'🔒':(isOp?((d&&TYPE_ICON[d.type])||'🎁'):'🎁');
    b.setAttribute('aria-label','Día '+n+(locked?' bloqueado':''));
  });
  const o=store.get('opened',[]).length, st=$('#status');
  if(preview) st.textContent='🛠️ Modo Vista Previa activo: todo desbloqueado y sin notificaciones.';
  else if(up===0){ const ms=doorDate(1)-new Date(); st.textContent=ms>0?'El día 1 abre en '+fmtRemaining(ms)+' 🎄':'Pronto…'; }
  else st.textContent='Has abierto '+o+' de '+up+' ventanitas disponibles'+(up<24?' · próxima en '+fmtRemaining(doorDate(up+1)-new Date()):' · ¡ya están todas!');
  $('#logroBadge').hidden = !store.get('logro',false);
  $('#previewBtn').textContent='🛠️ Modo Vista Previa (Piojo): '+(preview?'ON':'OFF');
  $('#resetBtn').hidden=!preview; $('#pfoot').hidden=!store.get('gate',false);
  $('#wait').hidden=!waitVisible();
  if(waitVisible()){ const u=WAIT_NOTES.filter(noteOpen).length; $('#notesCount').textContent=u+'/'+WAIT_NOTES.length; tickCountdown(); }
}
setInterval(refreshDoors,60000);

/* ---------- cuenta regresiva ---------- */
function tickCountdown(){
  const el=$('#cd'); if(!el||$('#wait').hidden) return;
  let ms=doorDate(1)-new Date();
  if(ms<=0){ el.innerHTML='<b style="font-size:1.4rem">¡Hoy empieza!</b>'; return; }
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sc=s%60;
  el.innerHTML=[[d,'días'],[h,'horas'],[m,'min'],[sc,'seg']].map(([v,l])=>`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
}
setInterval(tickCountdown,1000);

/* ---------- abrir día ---------- */
function msgHTML(t){ return fill(t).split(/\n\s*\n/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join(''); }

/* ---------- interacciones por día ---------- */
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,'').trim();
function solvedList(){ return store.get('solved',[]); }
function markSolved(n,d,what){
  if(preview) return;
  const l=solvedList(); if(l.includes(n)) return; l.push(n); store.set('solved',l);
  notifyPiojo('🧩 '+what,'Día '+n+': "'+d.title+'"');
}

/* ---------- heladería v2: minijuego original a pantalla completa ---------- */
const HEL={
 cont:[['cono','🍦 Cono'],['vaso','🥤 Vaso'],['tazon','🥣 Tazón']],
 sab:[['fresa','Fresa','#f7a1bc'],['vainilla','Vainilla','#fff0c4'],['choco','Chocolate','#8b5a44'],['matcha','Matcha','#b7d99f'],['taro','Taro','#cdb4ef'],['mango','Mango','#ffc56f']],
 top:[['chispas','Chispas'],['cereza','Cereza'],['galleta','Galleta'],['malvavisco','Malvavisco']]
};
const helName=(arr,id)=>(arr.find(x=>x[0]===id)||[])[1]||id;
const helColor=id=>(HEL.sab.find(x=>x[0]===id)||[0,0,'#ddd'])[2];
const hexMix=(a,b,t)=>{ const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16)); return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join(''); };
const toastColor=p=>p<1.2?hexMix('#ffffff','#e8b66a',p/1.2):hexMix('#e8b66a','#3b2b24',Math.min(1,(p-1.2)/1.2));
function helGeom(o){ const rim=o.c==='tazon'?160:150, c1=rim-22, n=(o.s||[]).length; const cy=c1-Math.max(0,n-1)*38, r=n>1?33:38; return {rim,c1,n,cy,r,topY:n?cy-r:rim}; }
function helInner(o,anim){
  const G=helGeom(o); let g='<ellipse cx="100" cy="254" rx="74" ry="8" fill="#f1cdd8" opacity=".7"/>';
  if(o.c==='cono') g+='<polygon points="60,150 140,150 100,252" fill="#e8b77a" stroke="#c98f52" stroke-width="3"/><path d="M72,160 L108,226 M92,152 L124,210 M128,152 L88,214 M108,152 L76,196 M84,152 L66,170" stroke="#c98f52" stroke-width="2" fill="none"/>';
  else if(o.c==='vaso') g+='<path d="M55,150 L145,150 L130,250 L70,250 Z" fill="#fff" stroke="#f4a9be" stroke-width="4"/><path d="M62,175 H138 M66,205 H134" stroke="#f9c9d6" stroke-width="9"/>';
  else if(o.c==='tazon') g+='<path d="M28,160 H172 Q166,246 100,252 Q34,246 28,160 Z" fill="#ffe3ec" stroke="#e57fa0" stroke-width="4"/><path d="M42,190 H158" stroke="#fff" stroke-width="6" opacity=".7"/>';
  else g+='<ellipse cx="100" cy="236" rx="62" ry="12" fill="none" stroke="#f4a9be" stroke-width="3" stroke-dasharray="7 7"/>';
  (o.s||[]).forEach((f,i)=>{ const cy=G.c1-i*38,r=i?33:38,col=helColor(f),nw=anim&&o.fresh===i;
    g+=`<g class="${nw?'plop':''}">${i===0?`<ellipse cx="100" cy="${G.rim-4}" rx="${r+6}" ry="10" fill="${col}" stroke="rgba(0,0,0,.14)" stroke-width="3"/>`:''}<circle cx="100" cy="${cy}" r="${r}" fill="${col}" stroke="rgba(0,0,0,.14)" stroke-width="3"/><ellipse cx="${100-r*.35}" cy="${cy-r*.45}" rx="${r*.26}" ry="${r*.13}" fill="rgba(255,255,255,.6)" transform="rotate(-25 ${100-r*.35} ${cy-r*.45})"/></g>`; });
  const y=G.topY, nt=anim&&o.fresh==='t'?'plop':'';
  (o.sp||[]).forEach(s=>{ g+=`<rect x="${s.x-5}" y="${s.y-2}" width="10" height="4.5" rx="2.2" fill="${s.c}" transform="rotate(${s.a} ${s.x} ${s.y})"/>`; });
  if(o.t==='cereza') g+=`<g class="${nt}"><path d="M100,${y-5} Q108,${y-30} 124,${y-34}" stroke="#4f8a5b" stroke-width="3" fill="none"/><circle cx="100" cy="${y-6}" r="12" fill="#d93a5f" stroke="#a82446" stroke-width="2"/><circle cx="95" cy="${y-11}" r="3.5" fill="rgba(255,255,255,.65)"/></g>`;
  if(o.t==='galleta') g+=`<g class="${nt}"><g transform="translate(${100+(o.gx||0)} ${y+8}) rotate(${o.tilt||0})"><rect x="-10" y="-58" width="20" height="62" rx="5" fill="#d9a566" stroke="#b9823f" stroke-width="2.5"/><path d="M-10,-40 H10 M-10,-22 H10 M-10,-4 H10" stroke="#b9823f" stroke-width="2"/></g></g>`;

function heladeria(d,n,holder,msg){

          const showTarget=()=>{ const G=helGeom(cur);
            if(k==='s'&&cur.c) svgT.innerHTML=`<ellipse class="pulse" cx="100" cy="${G.rim-34}" rx="56" ry="26" fill="rgba(255,255,255,.35)" stroke="#e57fa0" stroke-width="3" stroke-dasharray="6 5"/>`;
            if(k==='t'&&v==='cereza'&&cur.s.length) svgT.innerHTML=`<circle class="pulse" cx="100" cy="${G.topY-6}" r="15" fill="none" stroke="#e57fa0" stroke-width="3" stroke-dasharray="5 4"/>`;
            if(k==='t'&&v==='galleta'&&cur.s.length) svgT.innerHTML=`<ellipse class="pulse" cx="100" cy="${G.topY+6}" rx="44" ry="14" fill="rgba(255,255,255,.3)" stroke="#e57fa0" stroke-width="3" stroke-dasharray="6 5"/>`;
            if(k==='t'&&v==='chispas'&&cur.s.length) svgT.innerHTML=`<ellipse class="pulse" cx="100" cy="${G.topY-40}" rx="70" ry="38" fill="none" stroke="#e57fa0" stroke-width="3" stroke-dasharray="6 5"/>`; };
          const spawnSprinkle=()=>{
            const G=helGeom(cur); const a=Math.PI*(1.12+Math.random()*.76); const lx=100+Math.cos(a)*G.r*.9, ly=G.cy+Math.sin(a)*G.r*.9;
            const sc=['#e57fa0','#7fb593','#e8a23e','#8fa8e8','#d93a5f','#b69be8'][Math.floor(Math.random()*6)];
            const from=ctr(), to=toScr(lx,ly); pending++;
            fall(from.x+(Math.random()*20-10),from.y+14,`<div style="width:9px;height:4px;border-radius:3px;background:${sc}"></div>`,to.x-from.x,to.y-from.y-14,Math.random()*360|0,.5);
            setTimeout(()=>{ if(!root) return; pending--; cur.sp.push({x:lx,y:ly,a:Math.random()*180|0,c:sc}); if(cur.sp.length>=SPR&&!cur.t){ cur.t='chispas'; cur.fresh=null; floatText(to.x,to.y-30,'¡Listo! 🌈'); } render(); },480);
          };
          const mk=()=>{ ghost=document.createElement('div'); ghost.className='hghost';
            ghost.innerHTML=k==='c'?helSVG({c:v},78):k==='s'?scoopBall(helColor(v),58):topIcon(v,54);
            if(v==='chispas') ghost.style.setProperty('--rot','-40deg');
            root.appendChild(ghost); showTarget();
            if(v==='malvavisco'){ tv=setInterval(()=>{ if(!ghost) return; const f=$('#hg-flame').getBoundingClientRect(),c=ctr(); inFlame=c.x>f.left-14&&c.x<f.right+14&&c.y>f.top-24&&c.y<f.bottom+14; if(inFlame) prog+=.05;
              const r=ghost.querySelector('rect'); if(r) r.setAttribute('fill',toastColor(prog)); ghost.classList.toggle('hot',inFlame); $('#hg-flame').classList.toggle('hot',inFlame); $('#hg-bar i').style.width=Math.min(100,prog/2.4*100)+'%'; },50); } };
          const move=ev=>{
            pos={x:ev.clientX,y:ev.clientY};
            if(!moved&&Math.hypot(pos.x-sx,pos.y-sy)>6){ moved=true; mk(); }
            if(!moved) return; ev.preventDefault();
            const c=ctr(); ghost.style.left=c.x+'px'; ghost.style.top=c.y+'px';
            stage.classList.toggle('over',overStage(c)&&(k!=='t'||cur.s.length>0));

              if(Math.abs(s.x-100)<78&&s.y<G.topY+12&&s.y>G.topY-140){ sprAcc+=Math.abs(pos.x-lastX); while(sprAcc>=12&&cur.sp.length+pending<SPR){ sprAcc-=12; spawnSprinkle(); } } }

            if(k==='s'){
              if(!cur.c){ say2('Primero la base 🍨'); fall(c.x,c.y,scoopBall(helColor(v),58),0,320,40); return; }
              if(Math.abs(s.x-100)<=54&&s.y<G.rim+14){ addScoop(v); return; }
              const sg=s.x>=100?1:-1; fall(c.x,c.y,scoopBall(helColor(v),58),sg*40,380,sg*200); floatText(c.x,c.y-30,'¡Plaf! 😅'); return; }
            if(!cur.s.length){ say2('Primero pon una bola 🥄'); return; }
            if(v==='cereza'){
              if(Math.abs(s.x-100)<=16&&Math.abs(s.y-(G.topY-6))<=22){ cur.t='cereza'; cur.sp=[]; cur.fresh='t'; render(); burst(sc.x,sc.y,14); floatText(sc.x,sc.y-30,'¡Justo! 🍒'); }
              else { const sg=s.x>=100?1:-1; fall(c.x,c.y,topIcon('cereza',40),sg*110,360,sg*420); floatText(c.x,c.y-30,'¡Se cayó! 🍒'); say2('La cereza va justo en la punta ✨'); }
              return; }
            if(v==='galleta'){
              if(Math.abs(s.x-100)<=46&&s.y>G.topY-90&&s.y<G.topY+36){ cur.t='galleta'; cur.sp=[]; cur.gx=Math.round((s.x-100)*.6); cur.tilt=Math.max(-30,Math.min(30,Math.round((s.x-100)*.7))); cur.fresh='t'; render(); burst(sc.x,sc.y,10); floatText(sc.x,sc.y-30,'¡Clavada! 🍪'); }
              else { const sg=s.x>=100?1:-1; fall(c.x,c.y,topIcon('galleta',40),sg*90,340,sg*260); say2('Suéltala sobre el helado 🍪'); }

              else if(prog>1.8){ fall(c.x,c.y,topIcon('malvavisco',44).replace('#fff',toastColor(prog)),0,300,60); floatText(c.x,c.y-30,'¡Se quemó! 💨'); say2('Muy quemado… saca el malvavisco antes'); }

      const star=tips>=70?'⭐⭐⭐':tips>=45?'⭐⭐':'⭐';
      const line=tips>=70?'La jefa aprueba. Piojo te daría su sueldo completo (que ya es tuyo de todos modos).':tips>=45?'Nada mal, jefa. Piojo se acabó su helado y no dijo nada.':'Piojo se comió el helado chueco y igual dijo que estaba rico. Por amor.';
      root.innerHTML=`<div class="hg-end"><button class="hg-x" id="hgx" style="position:absolute;top:12px;right:12px">✕</button><h2>Fin del turno</h2><div class="big">${tips} 💰</div><div style="font-size:2rem">${star}</div><p style="max-width:340px">${line}${nb?'<br><b>¡Nuevo récord!</b>':''}</p><button class="obtn" id="hagain">Otro turno</button></div>`;
      wire(); $('#hagain').onclick=start; burst(innerWidth/2,innerHeight/2,50);
    };
    run();
  }
}

function setupInteractive(d,n){
  const ix=d.interactive; if(!ix) return;
  const msg=$('#mbody .msg'); if(!msg) return;
  const done=!preview && solvedList().includes(n);
  const fx=()=>{ const r=msg.getBoundingClientRect(); burst(r.left+r.width/2,r.top+30,26); };
  const holder=document.createElement('div'); holder.className='ix';
  const reveal=(what)=>{ msg.hidden=false; msg.classList.add('reveal'); markSolved(n,d,what); fx(); };

  if(ix.kind==='game'){ heladeria(d,n,holder,msg); return; }

  if(ix.kind==='scratch'){
    if(done) return;
    const wrap=document.createElement('div'); wrap.className='scratchwrap'; msg.parentNode.insertBefore(wrap,msg); wrap.appendChild(msg);
    const cv=document.createElement('canvas'); wrap.appendChild(cv);
    const W=wrap.clientWidth,H=Math.max(wrap.clientHeight,120),dpr=Math.min(devicePixelRatio||1,2);
    cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr);
    const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,'#f6a6bf'); g.addColorStop(.5,'#f9c9d6'); g.addColorStop(1,'#e8c39e');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    c.fillStyle='rgba(255,255,255,.9)'; c.font='700 26px Caveat, cursive'; c.textAlign='center';
    c.fillText(ix.label||'Raspa aquí con tu dedito ✨',W/2,H/2+8);
    let down=false,fin=false,moves=0;
    const scratch=e=>{ if(!down||fin) return; const r=cv.getBoundingClientRect(); const x=e.clientX-r.left,y=e.clientY-r.top;
      c.globalCompositeOperation='destination-out'; c.beginPath(); c.arc(x,y,24,0,7); c.fill();
      if(++moves%8===0) check(); };
    const check=()=>{ const d2=c.getImageData(0,0,cv.width,cv.height).data; let clear=0,tot=0;
      for(let i=3;i<d2.length;i+=64){ tot++; if(d2[i]<40) clear++; }
      if(clear/tot>.5){ fin=true; cv.style.opacity=0; setTimeout(()=>cv.remove(),800); markSolved(n,d,'Raspó el día'); fx(); } };
    cv.addEventListener('pointerdown',e=>{ down=true; cv.setPointerCapture(e.pointerId); scratch(e); });
    cv.addEventListener('pointermove',scratch);
    cv.addEventListener('pointerup',()=>{ down=false; check(); });
    cv.addEventListener('pointercancel',()=>{ down=false; });
    return;
  }

  if(ix.kind==='quiz'){
    if(done) return;
    msg.hidden=true;
    holder.innerHTML=`<p class="ixq">${esc(ix.q)}</p><div class="ixopts">${ix.options.map((o,i)=>`<button class="ixopt" data-i="${i}">${esc(o)}</button>`).join('')}</div><p class="ixmsg" id="ixm"></p>`;
    msg.parentNode.insertBefore(holder,msg);
    const bad=ix.wrong||['Mmm no 😏','Casi, bonita… pero no.','Piojo te está viendo y se ríe 👀','Otra vez, nooboo.'];
    let k=0;
    holder.querySelectorAll('.ixopt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===ix.answer){ b.classList.add('good'); holder.querySelectorAll('.ixopt').forEach(x=>x.disabled=true);
        $('#ixm').textContent=ix.right||'¡Sí! Te lo sabes todo 💗'; setTimeout(()=>{ holder.remove(); reveal('Resolvió el quiz'); },900); }
      else { b.classList.add('bad'); b.disabled=true; $('#ixm').textContent=bad[k++%bad.length]; }
    });
    return;
  }

  if(ix.kind==='word'){
    if(done) return;
    msg.hidden=true;
    holder.innerHTML=`<p class="ixq">${esc(ix.hint)}</p><div class="ixrow"><input class="ixin" id="ixw" autocomplete="off" placeholder="${esc(ix.placeholder||'escribe la palabra…')}"><button class="obtn" id="ixgo">Abrir 🔓</button></div><p class="ixmsg" id="ixm"></p><div class="ixrow" id="ixextra"></div>`;
    msg.parentNode.insertBefore(holder,msg);
    const answers=(Array.isArray(ix.answer)?ix.answer:[ix.answer]).map(norm); let fails=0,asked=false;
    const go=()=>{
      const v=norm($('#ixw').value); if(!v) return;
      if(answers.includes(v)){ holder.remove(); reveal('Abrió el cofre'); return; }
      fails++; $('#ixw').classList.remove('reveal'); void $('#ixw').offsetWidth;
      $('#ixm').textContent = (fails>=3 && ix.hint2) ? 'Otra pista: '+ix.hint2 : ['Nop 😌','Mmm, esa no.','Piojo aguanta la risa…'][fails%3];
      if(fails>=5 && !asked){ $('#ixextra').innerHTML='<button class="pill" id="ixask">🆘 Pedirle pista a Piojo</button>';
        $('#ixask').onclick=()=>{ asked=true; $('#ixextra').innerHTML='<span class="ixmsg">Pista enviada 💌 (Piojo ya está sonriendo)</span>';
          if(!preview) notifyPiojo('🆘 Pidió una pista','Día '+n+': "'+d.title+'". Lleva '+fails+' intentos.','high'); }; }
    };
    $('#ixgo').onclick=go; $('#ixw').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    return;
  }

  if(ix.kind==='palette'){
    holder.innerHTML=`<p class="ixq">${esc(ix.title||'Toca cada color')}</p><div class="pal">${ix.items.map((it,i)=>`<button class="sw" style="background:${esc(it.color)}" data-i="${i}" aria-label="${esc(it.name||'color')}"></button>`).join('')}</div><div class="swtxt" id="swt">${esc(ix.empty||'💄')}</div>`;
    msg.parentNode.insertBefore(holder,msg.nextSibling);
    const seen=new Set();
    holder.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
      holder.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      const it=ix.items[+b.dataset.i]; const t=$('#swt'); t.classList.remove('reveal'); void t.offsetWidth; t.classList.add('reveal');
      t.innerHTML=(it.name?'<b>'+esc(it.name)+'</b><br>':'')+esc(it.text);
      const r=b.getBoundingClientRect(); burst(r.left+r.width/2,r.top,10);
      seen.add(+b.dataset.i); if(seen.size===ix.items.length) markSolved(n,d,'Descubrió toda la paleta');
    });
    return;
  }

  if(ix.kind==='timeline'){
    holder.innerHTML=`<p class="ixq">${esc(ix.title||'Nuestra línea del tiempo')}</p><div class="tl">${ix.items.map((it,i)=>`<div class="tli" style="animation-delay:${.25*i}s"><b>${esc(it.date)}</b><span>${esc(it.text)}</span></div>`).join('')}</div>`;
    msg.parentNode.insertBefore(holder,msg.nextSibling);
    return;
  }

  if(ix.kind==='layers'){
    if(done) return;
    const paras=[...msg.querySelectorAll('p')]; if(paras.length<2) return;
    paras.forEach((p,i)=>{ if(i>0) p.hidden=true; });
    holder.innerHTML=`<button class="obtn layerbtn" id="ixnext">${esc(ix.button||'Sigue ♥')}</button>`;
    msg.parentNode.insertBefore(holder,msg.nextSibling);
    let i=0;
    $('#ixnext').onclick=()=>{
      i++; const p=paras[i]; p.hidden=false; p.classList.add('reveal');
      const r=p.getBoundingClientRect(); burst(r.left+r.width/2,r.top,12);
      p.scrollIntoView({behavior:'smooth',block:'center'});
      if(i>=paras.length-1){ holder.remove(); markSolved(n,d,'Leyó la carta completa'); setTimeout(()=>{ burst(innerWidth/2,innerHeight/2,60); },400); }
    };
    return;
  }
}

function openDay(n, ev){
  const d=CALENDAR_DAYS.find(x=>x.day===n); if(!d){ toast('Este día todavía se está preparando… vuelve en un ratito 💗'); return; }

    opened.push(n); store.set('opened',opened);
    notifyPiojo('🎄 Abrió el día '+n, 'Acaba de abrir el día '+n+': "'+d.title+'"');
  }

  else m.innerHTML=art(d.type);
  if(d.audioUrl){ const a=document.createElement('audio'); a.controls=true; a.preload='none'; a.src=d.audioUrl; m.appendChild(a);
    a.addEventListener('play',()=>duck(true)); a.addEventListener('pause',()=>duck(false)); a.addEventListener('ended',()=>duck(false)); }
  const cb=$('#claimBtn');
  if(cb) cb.onclick=()=>{
    if(!preview){ const c=store.get('claimed',[]); if(!c.includes(n)){ c.push(n); store.set('claimed',c);
      notifyPiojo('🎟️ Vale reclamado','Reclamó: "'+d.title+'" (día '+n+')','high'); } }
    cb.outerHTML='<div class="stamp">✔ VALE RECLAMADO'+(preview?' (vista previa)':'')+'</div>';
    const r=$('.stamp').getBoundingClientRect(); burst(r.left+r.width/2,r.top,30);
  };
  setupInteractive(d,n);
  const x=ev&&ev.clientX?ev.clientX:innerWidth/2, y=ev&&ev.clientY?ev.clientY:innerHeight/2; burst(x,y,28);
  refreshDoors();
}

/* ---------- anti-desesperada ---------- */
function shieldActive(){ const a=getAttempts(); return a>=5 && a<=7; }
function dodge(el){
  const r=el.getBoundingClientRect();
  const tx=Math.random()*Math.max(10,innerWidth-r.width-20)+10, ty=Math.random()*Math.max(10,innerHeight-r.height-20)+10;
  el._x=(el._x||0)+(tx-r.left); el._y=(el._y||0)+(ty-r.top);
  el.classList.add('dodging'); el.style.transform=`translate(${el._x}px,${el._y}px) rotate(${(Math.random()*30-15)|0}deg)`;
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.transform=''; el._x=el._y=0; el.classList.remove('dodging'); },2600);
}
function teasingMessage(n,day){
  const t=fmtRemaining(doorDate(day)-new Date());
  return [
   `Tranquila, nooboo, ni que por picarle más rápido se adelantara diciembre. Faltan ${t}.`,
   `Snoopy está vigilando tus deditos desesperados 👀 Este día abre en ${t}.`,
   `Babe, respira. Piojo programó el candado con amor (y con un poquito de maldad). Faltan ${t}.`,
   `Cuarto intento… Piojo ya está sonriendo desde su pantalla, bonita 😏 Faltan ${t}.`][n-1];
}
function lockedTouch(el){
  const day=+el.dataset.day, n=bumpAttempts();
  if(n<=4){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); toast(teasingMessage(n,day)); }
  else if(n<=7){
    toast(n===5?'🛡️ ¡Escudo Anti-Curiosas activado! La casilla ya no se deja tocar.':n===6?'Te dije que se esconde. Piojo programó cada píxel 😌':'Una más y mejor no lo intentes… 🫣');
    dodge(el); refreshDoors();
  } else if(n<=9){ hackSequence(n); }
  else{
    if(!store.get('logro',false)) logroScreen();
    else toast('Ya tienes el logro, desesperada oficial 🏆 Ahora solo toca esperar ('+fmtRemaining(doorDate(day)-new Date())+').');
  }
}
grid.addEventListener('pointerdown',e=>{ const b=e.target.closest('.door'); if(b && b.classList.contains('locked')) lockedTouch(b); });
grid.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse') return; const b=e.target.closest('.door.locked');
  if(b && shieldActive() && !b.classList.contains('dodging')) dodge(b);
});
grid.addEventListener('click',e=>{
  const b=e.target.closest('.door'); if(!b) return;
  if(b.classList.contains('locked')){ if(e.detail===0) lockedTouch(b); return; }
  openDay(+b.dataset.day,e);
});

  function spawn(){

    const el=document.createElement('button'); el.className='gi'; el.textContent=t.e;
    el.style.left=Math.random()*Math.max(10,a.clientWidth-46)+'px'; el.style.setProperty('--h',(a.clientHeight+70)+'px'); el.style.animationDuration=(2.2+Math.random()*1.8)+'s';

  function end(){
    stop(); const a=$('#garena'); if(a) a.innerHTML='';
    const nb=score>best; if(nb){ best=score; store.set('gbest',best); const g=$('#gbest'); if(g) g.textContent=best; }
    const msg=score>=30?'¡Eres una crack! 🏆':score>=18?'¡Muy bien, nooboo! ✨':'Buen intento, otra ronda 💗';
    const rs=$('#gres'); if(rs) rs.textContent=score+' puntos · '+msg+(nb&&score>0?' · ¡nuevo récord!':'');
    const b=$('#gstart'); if(b){ b.disabled=false; b.textContent='🔁 Otra vez'; }
    if(nb && score>0) notifyPiojo('🎁 Récord en Atrapa regalitos','Hizo '+score+' puntos.','low');
  }
  $('#gstart').onclick=()=>{
    stop(); score=0; left=30; run=true; $('#gscore').textContent='0'; $('#gtime').textContent='30'; $('#gres').textContent='¡Ahora!'; $('#garena').innerHTML='';
    $('#gstart').disabled=true; spawn(); spawnIv=setInterval(spawn,430);
    timeIv=setInterval(()=>{ left--; const t=$('#gtime'); if(t) t.textContent=left; if(left<=0) end(); },1000);
  };
};


/* ---------- acceso secreto (Piojo): toca el título 7 veces ---------- */
const h53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);};
let tapN=0, tapT=0;
document.querySelector('header h1').addEventListener('click',()=>{
  const now=Date.now(); tapN = (now-tapT<3000)? tapN+1 : 1; tapT=now;
  if(tapN>=7){
    tapN=0;
    openOverlay('<div class="logro"><input id="gcode" type="password" autocomplete="off" placeholder="…" style="width:100%;padding:10px;border-radius:12px;border:2px solid var(--pink2);font:inherit"><div class="btnrow" style="justify-content:center"><button class="obtn" id="gok">Entrar</button><button class="pill" id="gno">Cancelar</button></div><div class="patmsg" id="gmsg"></div></div>');
    $('#gcode').focus();
    $('#gno').onclick=closeOverlay;
    const go=()=>{
      if(h53($('#gcode').value.trim().toLowerCase())===GATE_HASH){ store.set('gate',true); preview=true; store.set('preview',true); closeOverlay(); refreshDoors(); toast('Modo Piojo activado 🛠️'); }
      else $('#gmsg').textContent='Nop 😌';
    };
    $('#gok').onclick=go; $('#gcode').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  }
});

/* ---------- modo vista previa ---------- */
$('#previewBtn').onclick=()=>{ preview=!preview; store.set('preview',preview); closeModal(); refreshDoors(); toast(preview?'Vista previa ON: todo abierto y sin notificaciones.':'Vista previa OFF: vuelve el candado real.'); };
$('#resetBtn').onclick=()=>{ store.set('opened',[]); store.set('claimed',[]); store.set('att',{k:'',n:0}); sess.set('att',{k:'',n:0}); store.set('logro',false); store.set('visited',false); store.set('gbest',0); store.set('look',{}); refreshDoors(); toast('Progreso reiniciado en este dispositivo.'); };

/* ---------- música ---------- */
const bgm=$('#bgm'); let vol=.25, want=false, userPaused=false, mode=null, fileFailed=!AUDIO_NAVIDAD_URL, ducked=false;
let ctx=null, master=null, loopT=null;
const NOTE={D4:62,E4:64,Fs4:66,G4:67,A4:69,B4:71,C5:72,D5:74};
const MEL=[['D4',1],['G4',1],['G4',.5],['A4',.5],['G4',.5],['Fs4',.5],['E4',1],['E4',1],['E4',1],['A4',1],['A4',.5],['B4',.5],['A4',.5],['G4',.5],['Fs4',1],['D4',1],['D4',1],['B4',1],['B4',.5],['C5',.5],['B4',.5],['A4',.5],['G4',1],['E4',1],['D4',.5],['D4',.5],['E4',1],['A4',1],['Fs4',1],['G4',2]];
const BEAT=.62, hz=m=>440*Math.pow(2,(m-69)/12);
function bell(t,f,len){
  [[1,.5],[2,.18],[3,.07]].forEach(([mul,amp])=>{
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=f*mul;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+len*1.8);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+len*1.8+.1);
  });
}
function schedLoop(){
  if(!ctx) return; const t=ctx.currentTime+.15; let total=0;
  MEL.forEach(([n,b])=>{ bell(t+total*BEAT,hz(NOTE[n]),b*BEAT); total+=b; });
  [[0,55],[3,50],[6,52],[9,55],[12,50],[15,55],[18,52],[21,43],[24,52],[27,55]].forEach(([b,m])=>bell(t+b*BEAT,hz(m),2*BEAT));
  loopT=setTimeout(schedLoop,(total*BEAT+2.2)*1000);
}
function startSynth(){
  try{ if(ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=vol*.6; master.connect(ctx.destination); if(ctx.state==='suspended') ctx.resume(); schedLoop(); mode='synth'; }catch(e){}
}
function stopSynth(){ clearTimeout(loopT); if(ctx){ try{ctx.close();}catch(e){} } ctx=null; master=null; }
function setIcon(){ $('#pbtn').textContent=(want&&!ducked)?'⏸':'▶'; }
async function startMusic(){
  want=true; setIcon();
  if(!fileFailed){
    try{ if(!bgm.src) bgm.src=AUDIO_NAVIDAD_URL; bgm.volume=vol; await bgm.play(); mode='file'; return; }
    catch(e){ fileFailed=true; }
  }
  startSynth();
}
function stopMusic(){ want=false; setIcon(); try{bgm.pause();}catch(e){} stopSynth(); }
function duck(on){ ducked=on; if(on){ try{bgm.pause();}catch(e){} stopSynth(); setIcon(); } else if(want && !userPaused){ startMusic(); } }
bgm.addEventListener('error',()=>{ fileFailed=true; if(want && mode!=='synth'){ startSynth(); } });
$('#pbtn').onclick=e=>{ e.stopPropagation(); if(want){ userPaused=true; stopMusic(); } else { userPaused=false; startMusic(); } };
$('#vol').addEventListener('input',e=>{ vol=e.target.value/100; bgm.volume=vol; if(master) master.gain.value=vol*.6; });
bgm.volume=vol;
function firstTouch(){ removeEventListener('pointerdown',firstTouch,true); removeEventListener('keydown',firstTouch,true); if(!userPaused && !want) startMusic(); }
addEventListener('pointerdown',firstTouch,true); addEventListener('keydown',firstTouch,true);

/* ---------- inicio ---------- */
if(!preview && !store.get('visited',false)){ store.set('visited',true); notifyPiojo('👀 Abrió el calendario','Acaba de entrar al calendario por primera vez.','high'); }
refreshDoors();
})();
</script>
